name: Update Uptime

on:
  schedule:
    - cron: '0 0 * * *'  
  workflow_dispatch:     
jobs:
  update-uptime:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate and inject uptime
        run: python .github/scripts/update_uptime.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update uptime [skip ci]"
          git push
